---
# Public, read-only view of the portfolio's Kafka at kafka.emersonzulian.dev: topics,
# messages (order.paid events of the shop), consumer groups and their lag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
        app.kubernetes.io/name: kafka-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: /config/config.yaml
            - name: KAFKA_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef: {name: kafka-ui, key: sasl.jaas.config}
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=70 -Djava.io.tmpdir=/tmp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 60
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 640Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: kafka-ca, mountPath: /etc/kafka-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: kafka-ui-config
        # The cluster CA Strimzi signs the broker certificates with.
        - name: kafka-ca
          secret:
            secretName: portfolio-cluster-ca-cert
            items:
              - {key: ca.crt, path: ca.crt}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  labels:
    app: kafka-ui
spec:
  selector:
    app: kafka-ui
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-ui
  labels:
    prometheus.homelab/instance: portfolio # skipped by the central Prometheus
spec:
  selector:
    matchLabels:
      app: kafka-ui
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 60s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-ui
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare: "true"
spec:
  parentRefs:
    - name: portfolio
      sectionName: https
  hostnames:
    - "kafka.emersonzulian.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kafka-ui
          port: 80
    # Spring's actuator (health, metrics) is for the cluster, not visitors.
    - matches:
        - path:
            type: PathPrefix
            value: /actuator
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: kafka-ui-not-found
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: kafka-ui-not-found
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body:
      type: Inline
      inline: "Not Found"
