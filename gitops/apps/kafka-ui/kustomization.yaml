---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./kafka-ui.yaml
# Hashed name: a config change rolls the pod by itself.
configMapGenerator:
  - name: kafka-ui-config
    files:
      - ./config.yaml
