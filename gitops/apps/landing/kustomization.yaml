---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./pdb.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./httproute-www.yaml
# Hashed names: editing the page or the nginx config rolls the Deployment by itself.
configMapGenerator:
  - name: landing-site
    files:
      - ./site/index.html
  - name: landing-nginx
    files:
      - default.conf=./nginx.conf
