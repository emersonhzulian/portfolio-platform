---
# The apex needs its own listener (`https-apex` in platform/gateway/gateway.yaml): in Gateway
# API, `*.emersonzulian.dev` doesn't match the bare domain. www redirects to the apex.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: landing
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare: "true"
spec:
  parentRefs:
    - name: portfolio
      sectionName: https-apex
  hostnames:
    - "emersonzulian.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: landing
          port: 80
