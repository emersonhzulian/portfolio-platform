---
# files.emersonzulian.dev: each visitor downloads their own receipts. Login is done by the
# gateway, not by FileBrowser: the SecurityPolicy (security.yaml) runs OIDC against authentik,
# verifies the token and passes the username in X-Auth-User; FileBrowser trusts that header
# (auth.method=proxy), creates the user on first visit and confines them to users/<name>.
# Read-only for everyone: download is the only permission.
#
# One replica: its user database is a scratch file (users are re-created from the header on
# their next visit), and FileBrowser signs its session tokens with a per-database key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
        app.kubernetes.io/name: filebrowser
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:v2.63.23
          command: [/bin/sh, -c]
          args:
            - |
              set -e
              DB=/db/filebrowser.db
              /bin/filebrowser config init --database "$DB" >/dev/null
              /bin/filebrowser config set --database "$DB" \
                --address 0.0.0.0 --port 8080 --root /srv \
                --auth.method=proxy --auth.header=X-Auth-User --create-user-dir \
                --branding.name "Portfolio receipts" --branding.disableExternal \
                --perm.admin=false --perm.create=false --perm.delete=false --perm.rename=false \
                --perm.modify=false --perm.share=false --perm.execute=false --perm.download=true \
                >/dev/null
              exec /bin/filebrowser --database "$DB"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: receipts, mountPath: /srv}
            - {name: db, mountPath: /db}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: receipts
          persistentVolumeClaim:
            claimName: shop-receipts
        - name: db
          emptyDir: {}
        - name: tmp
          emptyDir: {}
