---
# The gateway logs visitors in before anything reaches FileBrowser:
#   oidc - authorization code flow with authentik (client portfolio-files), session cookies on
#          files.emersonzulian.dev, the access token forwarded upstream;
#   jwt  - verifies that token against authentik's keys and copies preferred_username into
#          X-Auth-User, overwriting whatever the client may have sent in that header.
# FileBrowser only accepts traffic from the gateways (network policy), so the header can't be
# forged by going around them.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: files
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: files
  oidc:
    provider:
      issuer: https://auth.emersonzulian.dev/application/o/portfolio-files/
      # Spelled out so Envoy Gateway never fetches the discovery document: it only does so
      # when building config, treats a 404 as permanent and doesn't retry until some other
      # resource changes. An authentik restart (blueprints still creating the provider) left
      # this route answering 500 long after authentik was back. With the endpoints here, an
      # authentik outage only fails logins while it lasts.
      authorizationEndpoint: https://auth.emersonzulian.dev/application/o/authorize/
      tokenEndpoint: https://auth.emersonzulian.dev/application/o/token/
      endSessionEndpoint: https://auth.emersonzulian.dev/application/o/portfolio-files/end-session/
    clientID: portfolio-files
    # Generated on authentik's side (../../platform/authentik/manifests/oidc-files.yaml).
    clientSecret:
      name: files-oidc
    redirectURL: https://files.emersonzulian.dev/oauth2/callback
    logoutPath: /logout
    scopes: [openid, profile]
    forwardAccessToken: true
  jwt:
    providers:
      - name: authentik
        issuer: https://auth.emersonzulian.dev/application/o/portfolio-files/
        audiences: [portfolio-files]
        remoteJWKS:
          uri: https://auth.emersonzulian.dev/application/o/portfolio-files/jwks/
        claimToHeaders:
          - claim: preferred_username
            header: X-Auth-User
