---
# Steady background traffic so request rate/latency panels and traces aren't empty when
# nobody is visiting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-traffic
  labels:
    app: demo-traffic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-traffic
  template:
    metadata:
      labels:
        app: demo-traffic
    spec:
      containers:
        - name: traffic
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              while true; do
                wget -qO- http://demo/ >/dev/null
                wget -qO- http://demo/Privacy >/dev/null
                wget -qO- http://demo/does-not-exist >/dev/null 2>&1
                sleep 5
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: {drop: ["ALL"]}
