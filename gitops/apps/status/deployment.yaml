---
# Public status page (status.emersonzulian.dev). One replica on purpose: history lives in a
# SQLite file on a block volume, which only one writer can hold. A restart is a few seconds
# without the page, not a gap in history.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  labels:
    app: gatus
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume: the old pod must let go before the new one mounts it.
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
        app.kubernetes.io/name: gatus
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gatus
          image: twinproduction/gatus:v5.37.0
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            - name: TMPDIR
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
        - name: tmp
          emptyDir: {}
