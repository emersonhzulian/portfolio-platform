---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./gatus.yaml
  - ./httproute.yaml
# Hashed name: a config change rolls the pod by itself.
configMapGenerator:
  - name: gatus-config
    files:
      - ./config.yaml
