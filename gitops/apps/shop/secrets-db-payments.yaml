---
# Login of the `payments` database role. CloudNativePG reads it (managed role in
# database-cluster.yaml) and sets it on the role; the payments service reads it to connect.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-db-payments
spec:
  refreshPolicy: CreatedOnce
  target:
    name: shop-db-payments
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: payments
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: shop-random
