---
# The shop's credentials are generated in-cluster - none of them exists anywhere else, so
# nothing needs to be stored in OpenBao. (Its OIDC client secret is generated on the issuer's
# side: ../../platform/authentik/manifests/oidc-clients.yaml.) External Secrets' Password generator makes each one
# once (refreshPolicy: CreatedOnce) and never rotates it behind the apps' back.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: shop-random
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Login of the `payments` database role. CloudNativePG reads it (managed role in
# database.yaml) and sets it on the role; the payments service reads it to connect.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-db-payments
spec:
  refreshPolicy: CreatedOnce
  target:
    name: shop-db-payments
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: payments
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: shop-random
---
# HMAC key the payment provider signs its webhooks with; orders verifies them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-webhook
spec:
  refreshPolicy: CreatedOnce
  target:
    name: shop-webhook
    template:
      data:
        secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: shop-random
