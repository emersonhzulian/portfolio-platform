---
# HMAC key the payment provider signs its webhooks with; orders verifies them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-webhook
spec:
  refreshPolicy: CreatedOnce
  target:
    name: shop-webhook
    template:
      data:
        secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: shop-random
