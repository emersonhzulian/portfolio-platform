---
# One PostgreSQL cluster (CloudNativePG), one database per service: `orders` (created at
# bootstrap, owner `orders`) and `payments` (a declarative Database object, owner `payments`,
# a managed role whose password comes from secrets.yaml). Neither service can read the
# other's data. Single instance on iSCSI, Delete class - demo data.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  bootstrap:
    initdb:
      database: orders
      owner: orders
  managed:
    roles:
      - name: payments
        ensure: present
        login: true
        passwordSecret:
          name: shop-db-payments
    services:
      disabledDefaultServices: ["ro", "r"]
  storage:
    size: 2Gi
    storageClass: freenas-iscsi-csi
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 512Mi}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: shop-db-payments
spec:
  cluster:
    name: shop-db
  name: payments
  owner: payments
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shop-db
  labels:
    prometheus.homelab/instance: portfolio # skipped by the central Prometheus
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: shop-db
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
