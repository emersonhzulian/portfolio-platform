---
# orders: catalog, orders, the payment webhook and the order.paid event (shop/orders).
# Called by the web app (with the visitor's access token) and by payments (the webhook).
#
# Released as a canary too, but without a traffic router: orders is only called inside the
# cluster, through its Service, with no HTTPRoute to weigh. The split is by pods instead - at
# 50% one of the two replicas runs the new version, and the Service sends it half the requests
# (and Kafka gives it its share of receipt.ready partitions). The same analysis as web judges
# that version alone (analysis.yaml). Schema changes have to suit both versions while they run
# side by side; today the schema is only ever created, never altered (Schema.EnsureAsync).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: shop-orders
  labels:
    app: shop-orders
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: shop-orders
  strategy:
    canary:
      analysis:
        templates:
          - templateName: canary-health
        args:
          - name: service
            value: shop-orders
          - name: hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 50
        - pause: {duration: 4m}
  template:
    metadata:
      labels:
        app: shop-orders
        app.kubernetes.io/name: shop-orders
        app.kubernetes.io/part-of: portfolio-shop
        # Traced by the OpenTelemetry dotnet agent (../../platform/policies/instrumentation.yaml).
        portfolio.emersonzulian.dev/instrument: dotnet
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: shop-orders
          # Rollouts label their pods with rollouts-pod-template-hash, not pod-template-hash.
          matchLabelKeys: [rollouts-pod-template-hash]
      containers:
        - name: orders
          image: ghcr.io/emersonhzulian/portfolio-platform/orders:0.1.4
          ports:
            - name: http
              containerPort: 8080
          env:
            # Set explicitly: the OpenTelemetry Operator names a service after the pod's owner,
            # and for a Rollout that's the ReplicaSet (shop-orders-<hash>), a new name each release.
            - name: OTEL_SERVICE_NAME
              value: shop-orders
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: shop-db-app, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: shop-db-app, key: password}
            - name: ConnectionStrings__Orders
              value: "Host=shop-db-rw;Database=orders;Username=$(DB_USER);Password=$(DB_PASSWORD);GSS Encryption Mode=Disable"
            - name: Payments__BaseUrl
              value: http://shop-payments
            - name: Orders__CallbackUrl
              value: http://shop-orders.portfolio.svc.cluster.local/payments/callback
            - name: Orders__WebhookSecret
              valueFrom:
                secretKeyRef: {name: shop-webhook, key: secret}
            - name: Kafka__BootstrapServers
              value: portfolio-kafka-bootstrap:9092
            # Tokens are issued for the public URL; the keys that verify them are read in-cluster.
            - name: Auth__Issuer
              value: https://auth.emersonzulian.dev/application/o/portfolio-shop/
            - name: Auth__MetadataAddress
              value: http://authentik-server/application/o/portfolio-shop/.well-known/openid-configuration
            - name: Auth__Audience
              value: portfolio-shop
            # The outbox publisher's spans (resuming the payment's trace) come from this source.
            - name: OTEL_DOTNET_AUTO_TRACES_ADDITIONAL_SOURCES
              value: Orders
            - name: OTEL_DOTNET_AUTO_LOG_DIRECTORY
              value: /tmp
            # Database spans come from the EF Core instrumentation. The agent turns EF Core's off for
            # Npgsql when its Npgsql instrumentation is on, and that one emits nothing with
            # Npgsql 10 - so with both defaults, queries never showed up in traces.
            - name: OTEL_DOTNET_AUTO_TRACES_NPGSQL_INSTRUMENTATION_ENABLED
              value: "false"
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /livez, port: http}
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Numeric, so the injected auto-instrumentation init container can run too.
            runAsUser: 1654
            runAsGroup: 1654
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-orders
spec:
  selector:
    app: shop-orders
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-orders
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: shop-orders
