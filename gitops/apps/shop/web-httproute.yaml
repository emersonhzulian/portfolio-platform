---
# shop.emersonzulian.dev. The weights are Argo Rollouts' to set during a canary; Argo CD
# ignores them (gitops/argocd/apps/shop.yaml, ignoreDifferences).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare: "true"
spec:
  parentRefs:
    - name: portfolio
      sectionName: https
  hostnames:
    - "shop.emersonzulian.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Weights belong to Argo Rollouts' Gateway API plugin during a release (Argo CD ignores
      # them, see ../../argocd/apps/shop.yaml); at rest, all traffic goes to stable.
      backendRefs:
        - name: shop-web
          port: 80
          weight: 100
        - name: shop-web-canary
          port: 80
          weight: 0
