---
# Emitted by the orders service when a payment is confirmed; consumed by the receipts worker.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: order.paid
  labels:
    strimzi.io/cluster: portfolio
  annotations:
    # Never pruned by Argo CD: deleting the CR deletes the topic and its events. Removing
    # it from Git leaves the topic in place; delete it by hand.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000 # 7 days
