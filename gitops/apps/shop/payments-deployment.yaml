---
# payments: the simulated Pix provider (shop/payments). Internal only - orders is its
# one caller; it approves charges after a delay and calls orders' webhook.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-payments
  labels:
    app: shop-payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop-payments
  template:
    metadata:
      labels:
        app: shop-payments
        app.kubernetes.io/name: shop-payments
        app.kubernetes.io/part-of: portfolio-shop
        # Traced by the OpenTelemetry dotnet agent (../../platform/policies/auto-instrumentation.yaml).
        portfolio.emersonzulian.dev/instrument: dotnet
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: shop-payments
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: payments
          image: ghcr.io/emersonhzulian/portfolio-platform/payments:0.1.3
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: shop-db-payments, key: password}
            - name: ConnectionStrings__Payments
              value: "Host=shop-db-rw;Database=payments;Username=payments;Password=$(DB_PASSWORD);GSS Encryption Mode=Disable"
            - name: Payments__WebhookSecret
              valueFrom:
                secretKeyRef: {name: shop-webhook, key: secret}
            - name: Payments__ApprovalDelaySeconds
              value: "8"
            # The approval worker's spans (resuming the checkout's trace) come from this source.
            - name: OTEL_DOTNET_AUTO_TRACES_ADDITIONAL_SOURCES
              value: Payments
            - name: OTEL_DOTNET_AUTO_LOG_DIRECTORY
              value: /tmp
            # Database spans come from the EF Core instrumentation. The agent turns EF Core's off for
            # Npgsql when its Npgsql instrumentation is on, and that one emits nothing with
            # Npgsql 10 - so with both defaults, queries never showed up in traces.
            - name: OTEL_DOTNET_AUTO_TRACES_NPGSQL_INSTRUMENTATION_ENABLED
              value: "false"
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /livez, port: http}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Numeric, so the injected auto-instrumentation init container can run too.
            runAsUser: 1654
            runAsGroup: 1654
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
