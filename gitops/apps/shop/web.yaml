---
# web: the storefront and backend-for-frontend (shop/web), at shop.emersonzulian.dev.
# Logs visitors in with authentik (OIDC), keeps sessions and per-user rate limits in Redis and
# calls orders with the visitor's access token.
#
# Released as a canary (Argo Rollouts): a new version gets 20%, then 50% of the real traffic -
# the gateway splits it, via the HTTPRoute below - while an analysis watches that version's
# own error rate and latency (analysis.yaml). If either goes bad, the rollout aborts and all
# traffic goes back to the stable version, without anyone touching it.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: shop-web
  labels:
    app: shop-web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: shop-web
  strategy:
    canary:
      stableService: shop-web
      canaryService: shop-web-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: shop
            namespace: portfolio
      analysis:
        templates:
          - templateName: canary-health
        startingStep: 1
        args:
          - name: service
            value: shop-web
          - name: hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 20
        - pause: {duration: 2m}
        - setWeight: 50
        - pause: {duration: 2m}
  template:
    metadata:
      labels:
        app: shop-web
        app.kubernetes.io/name: shop-web
        app.kubernetes.io/part-of: portfolio-shop
        # Traced by the OpenTelemetry nodejs agent (../../platform/policies/instrumentation.yaml).
        portfolio.emersonzulian.dev/instrument: nodejs
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: shop-web
          # A Rollout's ReplicaSets are told apart by this label (not pod-template-hash).
          matchLabelKeys: [rollouts-pod-template-hash]
      containers:
        - name: web
          image: ghcr.io/emersonhzulian/portfolio-platform/web:0.1.5
          ports:
            - name: http
              containerPort: 3000
          env:
            # Set explicitly: the OpenTelemetry Operator names a service after the pod's owner,
            # and for a Rollout that's the ReplicaSet (shop-web-<hash>), a new name each release.
            - name: OTEL_SERVICE_NAME
              value: shop-web
            - name: APP_URL
              value: https://shop.emersonzulian.dev
            - name: OIDC_ISSUER
              value: https://auth.emersonzulian.dev/application/o/portfolio-shop/
            - name: OIDC_CLIENT_ID
              value: portfolio-shop
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: shop-oidc, key: SHOP_OIDC_CLIENT_SECRET}
            - name: ORDERS_URL
              value: http://shop-orders
            # Database 1: database 0 holds the gateway's global rate-limit counters.
            - name: REDIS_URL
              value: redis://redis:6379/1
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            tcpSocket: {port: http}
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: next-cache, mountPath: /app/.next/cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# The stable and canary Services: Argo Rollouts points each at its version's pods (it adds
# the rollouts-pod-template-hash selector) and the gateway weighs them on the HTTPRoute.
apiVersion: v1
kind: Service
metadata:
  name: shop-web
spec:
  selector:
    app: shop-web
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web-canary
spec:
  selector:
    app: shop-web
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: shop-web
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare: "true"
spec:
  parentRefs:
    - name: portfolio
      sectionName: https
  hostnames:
    - "shop.emersonzulian.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Weights belong to Argo Rollouts' Gateway API plugin during a release (Argo CD ignores
      # them, see ../../argocd/apps/shop.yaml); at rest, all traffic goes to stable.
      backendRefs:
        - name: shop-web
          port: 80
          weight: 100
        - name: shop-web-canary
          port: 80
          weight: 0
