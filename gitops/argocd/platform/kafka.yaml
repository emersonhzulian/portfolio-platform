---
# Kafka (Strimzi, KRaft, one node) and its topics: the event bus for order.paid.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kafka
  namespace: argocd
  labels:
    portfolio.emersonzulian.dev/level: component
    portfolio.emersonzulian.dev/group: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: portfolio
  source:
    repoURL: https://github.com/emersonhzulian/portfolio-platform
    targetRevision: main
    path: gitops/platform/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
