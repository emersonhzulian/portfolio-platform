---
# Metrics: Prometheus, scraping only this namespace (plus cAdvisor / kube-state-metrics filtered to it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prometheus
  namespace: argocd
  labels:
    portfolio.emersonzulian.dev/level: component
    portfolio.emersonzulian.dev/group: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: portfolio
  source:
    repoURL: https://github.com/emersonhzulian/portfolio-platform
    targetRevision: main
    path: gitops/observability/prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
