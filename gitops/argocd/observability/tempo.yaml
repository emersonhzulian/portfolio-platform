---
# Traces: Tempo (single binary, 7 days); span metrics -> Prometheus.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-tempo
  namespace: argocd
  labels:
    portfolio.emersonzulian.dev/level: component
    portfolio.emersonzulian.dev/group: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: portfolio
  sources:
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: tempo
      targetRevision: 3.1.0
      helm:
        releaseName: tempo
        valueFiles:
          - $values/gitops/observability/tempo/values.yaml
    - repoURL: https://github.com/emersonhzulian/portfolio-platform
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
