---
# Shop: web (Next.js), orders and payments (.NET), their database and secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-shop
  namespace: argocd
  labels:
    portfolio.emersonzulian.dev/level: component
    portfolio.emersonzulian.dev/group: apps
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: portfolio
  source:
    repoURL: https://github.com/emersonhzulian/portfolio-platform
    targetRevision: main
    path: gitops/apps/shop
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  # Argo Rollouts drives these fields during a canary: the backend weights on the HTTPRoute,
  # and the stable/canary Services' version selector and ownership annotation. Without this,
  # self-heal would put them back mid-release.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: shop
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
    - group: ""
      kind: Service
      name: shop-web
      jqPathExpressions: &rollouts-service-fields
        - .spec.selector["rollouts-pod-template-hash"]
        - .metadata.annotations["argo-rollouts.argoproj.io/managed-by-rollouts"]
    - group: ""
      kind: Service
      name: shop-web-canary
      jqPathExpressions: *rollouts-service-fields
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # Also when applying, not only when comparing: a sync mustn't reset the weights.
      - RespectIgnoreDifferences=true
      # Delete what left Git only after the rest is applied and healthy - e.g. a Deployment
      # replaced by a Rollout keeps serving until the Rollout's pods are ready.
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
