---
# Same zone-scoped token as the Issuer (../gateway/externalsecret.yaml), plus the tunnel id
# every record points at.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: external-dns-cloudflare
  data:
    - secretKey: api-token
      remoteRef:
        key: portfolio/cloudflare
        property: api-token
    # Not secret, but kept next to the token so the tunnel can be recreated without a code change.
    - secretKey: tunnel-id
      remoteRef:
        key: portfolio/cloudflare
        property: tunnel-id
