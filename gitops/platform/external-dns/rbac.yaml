---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
---
# Only what the gateway-httproute source reads: Gateways/HTTPRoutes, and namespaces to
# evaluate the Gateway's allowedRoutes. It is a ClusterRole because external-dns lists
# these cluster-wide; it can't change anything in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portfolio-external-dns
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portfolio-external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portfolio-external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: portfolio
