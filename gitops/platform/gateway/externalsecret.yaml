---
# Cloudflare token for the Issuer's DNS-01 challenges, scoped to the emersonzulian.dev zone
# only (Zone:DNS:Edit + Zone:Read). external-dns uses the same token (../external-dns).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emersonzulian-cloudflare-token-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: emersonzulian-cloudflare-token-secret
  data:
    - secretKey: cloudflare-token
      remoteRef:
        key: portfolio/cloudflare
        property: api-token
