---
# Kafka for the portfolio's events (order.paid -> receipts), run by the cluster's Strimzi
# operator. One KRaft node that is both controller and broker: this is a demo's event bus,
# not a durability claim - replication factor 1 everywhere, and the README says so.
#
# Two listeners:
#   - `plain` (9092): the shop's services, inside the namespace. No authentication, and its
#     anonymous principal is a super user - the namespace's network policies are its boundary
#     (and the Kafka UI is kept off it).
#   - `scram` (9093, TLS): authenticated clients with their own ACLs. The public Kafka UI
#     connects here as KafkaUser `kafka-ui` (users.yaml), which may only read: even if the
#     UI's own read-only mode were bypassed, the broker refuses writes.
# Strimzi adds its own NetworkPolicies on top so its operator (namespace strimzi) can reach
# the broker's control ports, and makes its own components super users.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: portfolio
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: scram
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
      # The plain listener's clients (in-namespace only).
      superUsers:
        - ANONYMOUS
    config:
      # Single node: every internal topic has one replica.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Topics are declared as KafkaTopic objects (topic-*.yaml), never created by a typo.
      auto.create.topics.enable: false
      log.retention.hours: 168
    # Kafka's own metrics in Prometheus format, no JMX exporter config to maintain.
    metricsConfig:
      type: strimziMetricsReporter
      values:
        allowList:
          - "kafka_server_brokertopicmetrics.*"
          - "kafka_server_replicamanager.*"
          - "kafka_network_requestmetrics_requests_total.*"
          - "kafka_log_log_size.*"
          - "kafka_controller.*"
  entityOperator:
    # The topic operator turns KafkaTopic objects into topics; the user operator turns
    # KafkaUser objects into SCRAM credentials (a Secret per user) and ACLs.
    userOperator:
      resources:
        requests: {cpu: 10m, memory: 128Mi}
        limits: {memory: 384Mi}
    topicOperator:
      resources:
        requests: {cpu: 25m, memory: 128Mi}
        limits: {memory: 384Mi}
    template:
      pod:
        securityContext:
          runAsNonRoot: true
  # Consumer-group lag and per-topic offsets - what the receipts worker's dashboard reads.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
    template:
      pod:
        securityContext:
          runAsNonRoot: true
