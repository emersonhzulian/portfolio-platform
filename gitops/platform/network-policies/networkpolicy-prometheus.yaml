---
# Prometheus: admin UI through the private gateway; queried by the cluster's own Grafana;
# scrapes the cluster's kube-state-metrics, federates an allowlist from the central Prometheus
# and sends its alerts to the cluster's Alertmanager.
# (Kubelets and the API server: ciliumnetworkpolicy-prometheus-kubelets.yaml and
# ciliumnetworkpolicy-kube-apiserver.yaml.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              app.kubernetes.io/component: proxy
        # Argo Rollouts' controller runs the canary analysis queries.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argo-rollouts
        # The cluster's Grafana reads this Prometheus as a datasource (the central Prometheus
        # doesn't scrape anything here).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
      ports:
        - port: 8080
          protocol: TCP
    # /federate on the central Prometheus (allowlisted series only; see
    # ../../observability/prometheus/servicemonitor-platform.yaml).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
    # Alerts (spec.alerting in ../../observability/prometheus/prometheus.yaml).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 9093
          protocol: TCP
