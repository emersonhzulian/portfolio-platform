---
# Outbound by hostname, part 1. toFQDNs learns name -> IP from the DNS answers, so the pods
# that use it send their lookups through Cilium's DNS proxy. `matchPattern: "*"` observes
# every lookup; it doesn't allow any destination by itself (networkpolicy-allow-dns.yaml
# already allows DNS).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-proxy
specs:
  - endpointSelector:
      matchExpressions:
        - key: app
          operator: In
          values: [cloudflare-tunnel, external-dns, gatus, shop-web, synthetic-shopper]
    egress:
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: ANY
            rules:
              dns:
                - matchPattern: "*"
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: server
    egress:
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: ANY
            rules:
              dns:
                - matchPattern: "*"
