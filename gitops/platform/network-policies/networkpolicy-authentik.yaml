---
# authentik's server is reached through the gateways (auth.emersonzulian.dev publicly, the
# admin on the hosting cluster's private gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              app.kubernetes.io/component: proxy
      ports:
        - port: 9000
          protocol: TCP
