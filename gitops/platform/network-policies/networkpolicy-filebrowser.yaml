---
# FileBrowser trusts X-Auth-User, which the gateway writes from a verified authentik token
# (apps/files/security.yaml). So the gateway is the only thing allowed to reach it: from any
# other pod, that header would be a forgeable login.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: filebrowser
spec:
  podSelector:
    matchLabels:
      app: filebrowser
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              app.kubernetes.io/component: proxy
      ports:
        - port: 8080
          protocol: TCP
  # No egress beyond DNS (allow-dns): it serves files from its volume and calls nothing.
