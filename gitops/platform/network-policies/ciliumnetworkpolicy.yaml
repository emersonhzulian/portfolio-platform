---
# Only what a Kubernetes NetworkPolicy can't express (the rest is in networkpolicy.yaml).
# These add to the default-deny there; they don't replace it.
#
#   1. Outbound by hostname (toFQDNs). NetworkPolicy only knows IP blocks, and Cloudflare's
#      addresses change under us; the native alternative would be "any address on 443".
#   2. The API server. Cilium gives it its own identity (`kube-apiserver`), which an ipBlock
#      doesn't match - and an ipBlock would mean node IPs in this public folder.
#   3. The kubelets, for the same reason (identities `host` / `remote-node`).

# 1. ---------------------------------------------------------------------------------------
# toFQDNs learns name -> IP from the DNS answers, so the pods that use it send their lookups
# through Cilium's DNS proxy. `matchPattern: "*"` observes every lookup; it doesn't allow any
# destination by itself (allow-dns in networkpolicy.yaml already allows DNS).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-proxy
specs:
  - endpointSelector:
      matchExpressions:
        - key: app
          operator: In
          values: [cloudflare-tunnel, external-dns, gatus, shop-web]
    egress:
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: ANY
            rules:
              dns:
                - matchPattern: "*"
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: server
    egress:
      - toEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: ANY
            rules:
              dns:
                - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-by-hostname
specs:
  # cloudflared: tunnel control plane and API calls.
  - endpointSelector:
      matchLabels:
        app: cloudflare-tunnel
    egress:
      - toFQDNs:
          - matchPattern: "*.argotunnel.com"
          - matchPattern: "*.cloudflare.com"
          - matchName: "cloudflare.com"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
  # external-dns writes records through Cloudflare's API.
  - endpointSelector:
      matchLabels:
        app: external-dns
    egress:
      - toFQDNs:
          - matchName: "api.cloudflare.com"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
  # authentik's server verifies sign-up captchas with Cloudflare Turnstile.
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: server
    egress:
      - toFQDNs:
          - matchName: "challenges.cloudflare.com"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
  # The shop's web app talks OIDC to authentik on its public URL (discovery, code exchange):
  # authentik derives a token's issuer from the request's host, so the in-cluster address
  # would mint tokens nothing else accepts.
  - endpointSelector:
      matchLabels:
        app: shop-web
    egress:
      - toFQDNs:
          - matchName: "auth.emersonzulian.dev"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
  # Gatus probes the public endpoints the way a visitor does: out to Cloudflare and back in.
  - endpointSelector:
      matchLabels:
        app: gatus
    egress:
      - toFQDNs:
          - matchName: "emersonzulian.dev"
          - matchPattern: "*.emersonzulian.dev"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP

# 2. ---------------------------------------------------------------------------------------
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-apiserver
specs:
  # Prometheus: service discovery.
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
    egress:
      - toEntities: [kube-apiserver]
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
  # Loki's rules sidecar watches ConfigMaps.
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: loki
    egress:
      - toEntities: [kube-apiserver]
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
  # The OTLP collector's k8sattributes processor looks pods up.
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/component: opentelemetry-collector
    egress:
      - toEntities: [kube-apiserver]
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
  # external-dns reads HTTPRoutes.
  - endpointSelector:
      matchLabels:
        app: external-dns
    egress:
      - toEntities: [kube-apiserver]
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
  # CloudNativePG instance managers report status on their Cluster object.
  - endpointSelector:
      matchExpressions:
        - key: cnpg.io/cluster
          operator: Exists
    egress:
      - toEntities: [kube-apiserver]
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
  # Kafka brokers read their own config Secret through the API (Strimzi's
  # KubernetesSecretConfigProvider) before they start.
  - endpointSelector:
      matchLabels:
        strimzi.io/name: portfolio-kafka
    egress:
      - toEntities: [kube-apiserver]
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP
  # Strimzi's topic operator turns KafkaTopic objects into topics.
  - endpointSelector:
      matchLabels:
        strimzi.io/name: portfolio-entity-operator
    egress:
      - toEntities: [kube-apiserver]
        toPorts:
          - ports:
              - port: "6443"
                protocol: TCP

# 3. ---------------------------------------------------------------------------------------
---
# Prometheus scrapes cAdvisor on every kubelet (the control-plane node also carries the
# kube-apiserver identity, hence all three).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-kubelets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
