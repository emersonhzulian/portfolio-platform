---
# Loki receives node logs from the shipper DaemonSet, which runs in the privileged
# `opentelemetry` namespace (it needs hostPath; see ../../observability/opentelemetry).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opentelemetry
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-logs-portfolio-collector
      ports:
        - port: 3100
          protocol: TCP
