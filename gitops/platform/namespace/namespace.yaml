---
# Public-facing portfolio: its own Grafana, serving only published (public) dashboards, plus
# its own Prometheus, Loki and Tempo that only ever hold data from this namespace. Nothing
# here points at the cluster's own observability backends. See ../README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: portfolio
  annotations:
    # Opt-in for Chaos Mesh. It runs with enableFilterNamespace (hosting cluster's repository),
    # so it only selects pods in namespaces with this annotation; without it, the scheduled
    # experiments in ../../apps/chaos would find nothing to kill.
    chaos-mesh.org/inject: enabled
