---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./oidc-client-secrets.yaml
  - ./oidc-shop.yaml
  - ./oidc-files.yaml
  - ./bot-accounts.yaml
  - ./database.yaml
  - ./servicemonitor.yaml
  - ./podmonitor-db.yaml
  - ./httproute.yaml
  - ./httproutefilter.yaml
configMapGenerator:
  # The chart mounts it by this exact name (values.yaml, blueprints.configMaps); authentik
  # re-applies a blueprint when the mounted file changes, so no hash suffix is needed.
  - name: authentik-blueprints
    files:
      - ./blueprints/visitors.yaml
      - ./blueprints/shop.yaml
      - ./blueprints/files.yaml
      - ./blueprints/bots.yaml
    options:
      disableNameSuffixHash: true
