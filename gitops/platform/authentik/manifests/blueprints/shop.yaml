# The portfolio shop as an OIDC client of authentik (shop/web). Its client secret is
# generated in-cluster (gitops/apps/shop/secrets.yaml) and reaches authentik as
# the env var SHOP_OIDC_CLIENT_SECRET.
version: 1
metadata:
  name: Portfolio - shop
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: shop-provider
    identifiers:
      name: portfolio-shop
    attrs:
      client_type: confidential
      client_id: portfolio-shop
      client_secret: !Env SHOP_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://shop.emersonzulian.dev/auth/callback
        - matching_mode: strict
          url: https://shop.emersonzulian.dev
          redirect_uri_type: logout
      # Already logged in to authentik -> straight back to the shop, no consent screen.
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      # The shop keeps the session for as long as its access token lives.
      access_token_validity: hours=1
      include_claims_in_id_token: true

  - model: authentik_core.application
    identifiers:
      slug: portfolio-shop
    attrs:
      name: Portfolio Shop
      provider: !KeyOf shop-provider
      meta_launch_url: https://shop.emersonzulian.dev
      meta_description: Buy something and follow it through every layer of the platform.
      policy_engine_mode: any
