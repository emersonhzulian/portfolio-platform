# FileBrowser's OIDC client: the gateway (Envoy Gateway's OIDC filter) logs visitors in with it
# before files.emersonzulian.dev reaches FileBrowser. Client secret: env FILES_OIDC_CLIENT_SECRET
# (../oidc-client-secrets.yaml).
version: 1
metadata:
  name: Portfolio - files
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: files-provider
    identifiers:
      name: portfolio-files
    attrs:
      client_type: confidential
      client_id: portfolio-files
      client_secret: !Env FILES_OIDC_CLIENT_SECRET
      grant_types: [authorization_code]
      redirect_uris:
        - matching_mode: strict
          url: https://files.emersonzulian.dev/oauth2/callback
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      access_token_validity: hours=1

  - model: authentik_core.application
    identifiers:
      slug: portfolio-files
    attrs:
      name: My receipts
      provider: !KeyOf files-provider
      meta_launch_url: https://files.emersonzulian.dev
      meta_description: Download the receipts of your purchases in the shop.
      policy_engine_mode: any
