---
# Everything authentik needs that isn't in Git. OpenBao path portfolio/authentik:
#   secret-key          AUTHENTIK_SECRET_KEY (random, 50+ chars; signs sessions and tokens)
#   bootstrap-password  password of the `akadmin` admin, set on first start (LAN login only)
#   demo-password       password of the public `demo` account (blueprints/visitors.yaml) -
#                       shown on the login page, so it's public by design, but it stays out
#                       of Git like every other credential
# and portfolio/turnstile (a Cloudflare Turnstile widget for auth.emersonzulian.dev):
#   site-key, secret-key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-env
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef: {key: portfolio/authentik, property: secret-key}
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef: {key: portfolio/authentik, property: bootstrap-password}
    - secretKey: PORTFOLIO_DEMO_PASSWORD
      remoteRef: {key: portfolio/authentik, property: demo-password}
    - secretKey: TURNSTILE_SITE_KEY
      remoteRef: {key: portfolio/turnstile, property: site-key}
    - secretKey: TURNSTILE_SECRET_KEY
      remoteRef: {key: portfolio/turnstile, property: secret-key}
