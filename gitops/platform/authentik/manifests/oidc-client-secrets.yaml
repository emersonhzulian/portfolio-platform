---
# Client secrets of the OIDC applications authentik serves, generated in-cluster (they exist
# nowhere else, so nothing goes to OpenBao) once and never rotated behind anyone's back.
# authentik reads each as an env var (values.yaml) for its blueprint; the client app reads the
# same Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-client-secret
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
