---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-prometheus
---
# Long-lived token for the kubelet (cAdvisor) scrape - the same way the central
# Prometheus authenticates (kube-prometheus-stack-prometheus-token).
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-prometheus-token
  annotations:
    kubernetes.io/service-account.name: portfolio-prometheus
type: kubernetes.io/service-account-token
---
# Service discovery + kubelet metrics only. What is *kept* is limited to this namespace by
# the metricRelabelings in the ServiceMonitors, not by RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portfolio-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portfolio-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portfolio-prometheus
subjects:
  - kind: ServiceAccount
    name: portfolio-prometheus
    namespace: portfolio
