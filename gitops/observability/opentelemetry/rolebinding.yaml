---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-portfolio-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-portfolio-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otel-portfolio-collector
    namespace: portfolio
  # The node log shipper (logs-collector.yaml) runs in the opentelemetry namespace but only looks
  # pods up here, so it gets the same namespaced Role.
  - kind: ServiceAccount
    name: otel-logs-portfolio-collector
    namespace: opentelemetry
