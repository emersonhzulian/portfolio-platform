---
# k8sattributes in both portfolio collectors is limited to this namespace (filter.namespace),
# so a namespaced Role is enough. The operator creates the ServiceAccounts.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-portfolio-k8sattributes
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
