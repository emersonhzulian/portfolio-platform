---
# Portfolio copy of the cluster's Loki setup (7d retention, OTLP ingestion); only ever holds
# logs from the portfolio namespace.
# Helm values for the loki chart (source and version: ../apps/loki.yaml).
deploymentMode: SingleBinary
# The chart's default ClusterRole is named `loki-clusterrole` regardless of namespace and
# is already owned by the central Loki release; a namespaced Role avoids the clash.
rbac:
  namespaced: true
loki:
  auth_enabled: false
  # No usage stats to stats.grafana.org: egress out of this namespace is default-deny
  # (../../platform/network-policies), so it would only show up as dropped flows.
  analytics:
    reporting_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  pattern_ingester:
    enabled: true
  limits_config:
    # OTLP ingestion needs structured metadata (trace_id, span_id, k8s attributes).
    allow_structured_metadata: true
    volume_enabled: true
    # Default is 4MB/s (burst 6MB), which a node catching up after a collector restart
    # exceeds; 429s then pile up in the collector's queue.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    # The compactor only enforces this because compactor.retention_enabled is on.
    retention_period: 168h
    # Visitors can run any LogQL through Grafana's Explore: cap what one query may cost.
    query_timeout: 30s
    max_query_length: 168h
    max_query_lookback: 168h
    max_query_series: 500
    max_entries_limit_per_query: 5000
    max_query_parallelism: 4
    max_concurrent_tail_requests: 2
  querier:
    max_concurrent: 4
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
    # iSCSI, Delete class - see ../prometheus/prometheus.yaml.
    storageClass: freenas-iscsi-csi
# SingleBinary on a filesystem PVC needs none of the scale-out components.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
minio:
  enabled: false
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: true
    # The central Prometheus skips ServiceMonitors with this label (no double scrape).
    labels:
      prometheus.homelab/instance: portfolio
# The rules sidecar (loki-sc-rules) gets its own requests/limits, like every container here.
sidecar:
  resources:
    requests: {cpu: 5m, memory: 32Mi}
    limits: {memory: 128Mi}
