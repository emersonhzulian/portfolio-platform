---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  annotations:
    # Picked up by platform-external-dns (CNAME to the tunnel).
    external-dns.alpha.kubernetes.io/cloudflare: "true"
spec:
  parentRefs:
    - name: portfolio
      sectionName: https
  hostnames:
    - "grafana.emersonzulian.dev"
  rules:
    # Landing page -> the overview dashboard.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /d/portfolio-overview
            statusCode: 302
    # The whole UI, Explore included (anonymous Viewer, see grafana.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana-service
          port: 3000
    # 404 at the edge:
    #  - logins: the admin logs in on the private network only;
    #  - raw backend APIs a Viewer could otherwise reach through Grafana - the datasource proxy
    #    and resource calls for config, targets, rules, admin. Explore doesn't need them and
    #    they describe the cluster rather than the data. RegularExpression (case-insensitive)
    #    so by-id and by-uid paths are both covered; Envoy normalises the path (dot segments,
    #    %2F) before matching.
    - matches:
        - path:
            type: Exact
            value: /login
        - path:
            type: RegularExpression
            value: "(?i)^/api/datasources/proxy(/.*)?$"
        - path:
            type: RegularExpression
            value: "(?i)^/api/datasources/(uid/)?[^/]+/resources/(api/v1/)?(status|targets|rules|alerts|alertmanagers|admin|config)(/.*)?$"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: not-found
