# Builds the shop's services and pushes them to ghcr.io/emersonhzulian/portfolio-platform/<service>.
# Only services whose folder changed are rebuilt. Each build is tagged 0.1.<run number> (a
# version that only goes up, so Renovate can propose it as an update to the manifests in
# gitops/apps/shop) and sha-<commit> (which source it came from). Images published from this
# public repository are public too: the cluster pulls them without credentials.
name: shop

on:
  push:
    branches: [main]
    paths: ["shop/**", ".github/workflows/shop.yml"]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build (all if empty)"
        required: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            web: ["shop/web/**"]
            orders: ["shop/orders/**"]
            payments: ["shop/payments/**"]
            receipts: ["shop/receipts/**"]
            workflow: [".github/workflows/shop.yml"]
      - id: pick
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          REQUESTED: ${{ inputs.service }}
        run: |
          all='["web","orders","payments","receipts"]'
          if [ -n "$REQUESTED" ]; then echo "services=[\"$REQUESTED\"]" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || echo "$CHANGED" | grep -q workflow; then echo "services=$all" >> "$GITHUB_OUTPUT"
          else echo "services=$(echo "$CHANGED" | jq -c '[.[] | select(. != "workflow")]')" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=0.1.${{ github.run_number }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=portfolio-platform/${{ matrix.service }}
            org.opencontainers.image.description=The portfolio shop's ${{ matrix.service }} service (emersonzulian.dev)
      - uses: docker/build-push-action@v7.4.0
        with:
          context: shop/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
